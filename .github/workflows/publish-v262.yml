name: Publish Pulse Alarm v2.6.2

on:
  push:
    paths:
      - '.github/workflows/publish-v262.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout downloads repo
        uses: actions/checkout@v4

      - name: Download verified v2.6.2 build
        run: |
          curl -fL 'https://sdmntprseasia.oaiusercontent.com/files/00000000-2950-8207-8ebd-7270dacf6d84/raw?se=2026-09-16T23%3A47%3A54Z&sp=r&sv=2026-02-06&sr=b&scid=c8e0ffc6-6f12-5335-9285-14700e7bb1d0&skoid=ca37c3ec-ab43-496e-be5f-4684c5519a26&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T20%3A10%3A07Z&ske=2026-09-17T20%3A10%3A07Z&sks=b&skv=2026-02-06&sig=9Xmxf09olFuVGYZq5SwUKb2wm/hAjZJemtz/LyhZ3YU%3D' -o /tmp/pulse262.zip
          rm -rf /tmp/pulse262
          mkdir -p /tmp/pulse262
          unzip -q /tmp/pulse262.zip -d /tmp/pulse262
          test -f /tmp/pulse262/app-debug.apk
          echo '9408c592ec10f2506126ac928ff2ac9d682e85173dd88f36ad4374ee52b0e171  /tmp/pulse262/app-debug.apk' | sha256sum -c -

      - name: Publish updater files
        run: |
          mkdir -p apk
          cp /tmp/pulse262/app-debug.apk apk/PULSE-Stable-v2.6.2.apk
          cp /tmp/pulse262/app-debug.apk apk/PULSE-Stable-Latest.apk
          printf '2.6.2\n' > latest.txt
          python3 - <<'PY'
          import json
          path = 'suite-latest.json'
          with open(path, 'r', encoding='utf-8') as f:
              data = json.load(f)
          for app in data.get('apps', []):
              if app.get('key') == 'alarm':
                  app['version'] = '2.6.2'
                  app['url'] = 'https://raw.githubusercontent.com/jhayeroe/pulse-downloads/main/apk/PULSE-Stable-Latest.apk'
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          PY
          git config user.name 'PULSE Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apk/PULSE-Stable-v2.6.2.apk apk/PULSE-Stable-Latest.apk latest.txt suite-latest.json
          git commit -m 'Release Pulse Alarm v2.6.2' || exit 0
          git push
