name: Publish Pulse Suite Launcher v1.0.0

on:
  push:
    branches: [ main ]
    paths:
      - 'suite-launcher-trigger.txt'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout downloads repo
        uses: actions/checkout@v4

      - name: Download signed Pulse Suite artifact
        run: |
          curl -L --fail --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-5e6c-81f4-b19a-86807d8f9d5f/raw?se=2026-08-27T12%3A55%3A02Z&sp=r&sv=2026-02-06&sr=b&scid=a6c55976-ffbc-5492-916a-fa0a82fe3f0f&skoid=6658dbdd-f305-4d30-8f6b-d62218202cb9&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-27T06%3A47%3A27Z&ske=2026-08-28T06%3A47%3A27Z&sks=b&skv=2026-02-06&sig=PYgx4%2Bw6WyiXSJZRYHhtDG08McgA%2BrbxcQIrG0GJ07Y%3D' -o pulse-suite-v1.0.0.zip
          echo '1ef41feb4394bfb73f76249e8cf932d66c897d4c02e8e61c23a08832447a2bc5  pulse-suite-v1.0.0.zip' | sha256sum -c -
          rm -rf pulse-suite-release
          mkdir -p pulse-suite-release
          unzip -q pulse-suite-v1.0.0.zip -d pulse-suite-release
          echo '15d59c4a3950c6416a2d33097351f58ee83a15ce10d3e4c18c9988c09cfb5ec4  pulse-suite-release/PULSE-Suite-v1.0.0.apk' | sha256sum -c -

      - name: Publish Pulse Suite APK and update channel
        run: |
          mkdir -p apk
          cp pulse-suite-release/PULSE-Suite-v1.0.0.apk apk/PULSE-Suite-v1.0.0.apk
          cp pulse-suite-release/PULSE-Suite-v1.0.0.apk apk/PULSE-Suite-Latest.apk
          printf '1.0.0\n' > suite-latest.txt
          cat > suite-launcher.json <<'JSON'
          {
            "name": "Pulse Suite",
            "package": "com.pulse.suite.stable",
            "version": "1.0.0",
            "versionCode": 1,
            "url": "https://raw.githubusercontent.com/jhayeroe/pulse-downloads/main/apk/PULSE-Suite-Latest.apk",
            "sha256": "15d59c4a3950c6416a2d33097351f58ee83a15ce10d3e4c18c9988c09cfb5ec4",
            "notes": [
              "Pulse Account sign in and account creation",
              "RS8 workspace join and connection status",
              "Install, open and update Pulse Alarm, Calendar and Notes",
              "Guided Install / Update All with progress",
              "Light and dark appearance",
              "Pulse Suite icon and splash screen",
              "Built-in self-update and version history"
            ]
          }
          JSON

      - name: Commit public Pulse Suite release
        run: |
          rm -rf pulse-suite-v1.0.0.zip pulse-suite-release
          git config user.name 'PULSE Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apk/PULSE-Suite-v1.0.0.apk apk/PULSE-Suite-Latest.apk suite-latest.txt suite-launcher.json
          git commit -m 'Publish Pulse Suite launcher v1.0.0' || exit 0
          git push
