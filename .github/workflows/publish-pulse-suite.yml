name: Publish PULSE Suite Updater

on:
  push:
    branches: [ main ]
    paths:
      - 'release-trigger.txt'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout downloads repo
        uses: actions/checkout@v4

      - name: Download verified Pulse Alarm 2.5.10 build artifact
        run: |
          curl -L --fail --retry 3 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-22fc-8246-9d6e-8980b3069ff7/raw?se=2026-09-10T03%3A57%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=7c6f40a9-4e8e-57d2-a629-1c9d5d3dcf1c&skoid=ca37c3ec-ab43-496e-be5f-4684c5519a26&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-10T03%3A20%3A16Z&ske=2026-09-11T03%3A20%3A16Z&sks=b&skv=2026-02-06&sig=3v/nwyI8zU50JpgRSHOwtaQ1bYgXjuVmpmcxTfEcMIk%3D' -o pulse-alarm-2.5.10.zip
          rm -rf release-alarm
          mkdir -p release-alarm
          unzip -q pulse-alarm-2.5.10.zip -d release-alarm
          test -f release-alarm/app-debug.apk

      - name: Publish Pulse Alarm 2.5.10
        run: |
          mkdir -p apk
          cp release-alarm/app-debug.apk apk/PULSE-Stable-v2.5.10.apk
          cp release-alarm/app-debug.apk apk/PULSE-Stable-Latest.apk
          printf '2.5.10\n' > latest.txt
          python3 - <<'PY'
          import json
          p='suite-latest.json'
          with open(p,'r',encoding='utf-8') as f:
              data=json.load(f)
          for app in data.get('apps',[]):
              if app.get('key')=='alarm':
                  app['version']='2.5.10'
                  app['url']='https://raw.githubusercontent.com/jhayeroe/pulse-downloads/main/apk/PULSE-Stable-Latest.apk'
          with open(p,'w',encoding='utf-8') as f:
              json.dump(data,f,indent=2)
              f.write('\n')
          PY

      - name: Commit updater release
        run: |
          rm -rf pulse-alarm-2.5.10.zip release-alarm
          git config user.name 'PULSE Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apk/PULSE-Stable-v2.5.10.apk apk/PULSE-Stable-Latest.apk latest.txt suite-latest.json
          git commit -m 'Publish Pulse Alarm 2.5.10'
          git push
