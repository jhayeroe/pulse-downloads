name: Publish PULSE v2.5.1 APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-v251.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public downloads repo
        uses: actions/checkout@v4

      - name: Download signed PULSE v2.5.1 build
        run: |
          curl -L --fail 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-5040-8211-a6dd-9f3c40dd5e16/raw?se=2026-08-25T03%3A58%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=93c5a4cc-6148-57b9-94d5-acc98f0d8c96&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-25T03%3A21%3A55Z&ske=2026-08-26T03%3A21%3A55Z&sks=b&skv=2026-02-06&sig=e%2ByNrHUHU%2BFqTLT1hNqvIoaC5b6cJPC9iZ0etxKVZm0%3D' -o pulse.zip
          rm -rf extracted
          mkdir -p extracted apk
          unzip -o pulse.zip -d extracted
          APK_PATH="$(find extracted -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" apk/PULSE-Stable-v2.5.1.apk
          ls -lh apk/PULSE-Stable-v2.5.1.apk

      - name: Commit APK to public archive
        run: |
          git config user.name 'PULSE Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apk/PULSE-Stable-v2.5.1.apk
          if git diff --cached --quiet; then
            echo 'APK already published.'
            exit 0
          fi
          git commit -m 'Publish PULSE Stable v2.5.1 APK'
          git push
