name: Publish PULSE Suite Updater

on:
  push:
    branches: [ main ]
    paths:
      - 'release-trigger.txt'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout downloads repo
        uses: actions/checkout@v4

      - name: Download signed release bundle
        run: |
          curl -L --fail --retry 3 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-bad8-8211-85c4-092d937bb091/raw?se=2026-08-27T05%3A36%3A20Z&sp=r&sv=2026-02-06&sr=b&scid=33a12051-096a-5790-9ba5-7be23b99276c&skoid=0556a536-9b18-4aa8-bae0-70ed682ee936&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-27T02%3A52%3A41Z&ske=2026-08-28T02%3A52%3A41Z&sks=b&skv=2026-02-06&sig=AUV03/B5O06inAY57BrL9X2VXoIIgyid%2BQUTxUOx18E%3D' -o suite.zip
          rm -rf release-suite
          mkdir -p release-suite
          unzip -q suite.zip -d release-suite

      - name: Verify release checksums
        run: |
          cd release-suite
          sed 's#suite/##' SHA256SUMS.txt > SHA256SUMS.local.txt
          sha256sum -c SHA256SUMS.local.txt

      - name: Publish Pulse Alarm v2.5.5
        run: |
          mkdir -p apk
          cp release-suite/PULSE-Stable-v2.5.5.apk apk/PULSE-Stable-v2.5.5.apk
          cp release-suite/PULSE-Stable-v2.5.5.apk apk/PULSE-Stable-Latest.apk
          printf '2.5.5\n' > latest.txt
          cat > suite-latest.json <<'JSON'
          {
            "suite": "PULSE Suite",
            "schema": 1,
            "apps": [
              {
                "key": "alarm",
                "name": "Pulse Alarm",
                "package": "com.pulse.alarm.stable",
                "version": "2.5.5",
                "url": "https://raw.githubusercontent.com/jhayeroe/pulse-downloads/main/apk/PULSE-Stable-v2.5.5.apk"
              },
              {
                "key": "calendar",
                "name": "Pulse Calendar",
                "package": "com.pulse.calendar.stable",
                "version": "1.3.2",
                "url": "https://raw.githubusercontent.com/jhayeroe/pulse-downloads/main/apk/PULSE-Calendar-v1.3.2.apk"
              },
              {
                "key": "notes",
                "name": "PULSE Notes",
                "package": "com.pulse.notes.stable",
                "version": "1.0.4",
                "url": "https://raw.githubusercontent.com/jhayeroe/pulse-downloads/main/apk/PULSE-Notes-v1.0.4.apk"
              }
            ]
          }
          JSON

      - name: Commit updater release
        run: |
          rm -rf suite.zip release-suite
          git config user.name 'PULSE Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apk/PULSE-Stable-v2.5.5.apk apk/PULSE-Stable-Latest.apk latest.txt suite-latest.json
          git commit -m 'Publish Pulse Alarm v2.5.5 grouped alarm UI'
          git push
