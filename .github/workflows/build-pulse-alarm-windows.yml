name: Build PULSE Alarm Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'pulse-alarm-windows/**'
      - '.github/workflows/build-pulse-alarm-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish portable Windows app
        run: dotnet publish pulse-alarm-windows/PulseAlarm.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: PULSE-Alarm-Windows-v1.0.0
          path: publish/**
