name: Publish PULSE Suite Updater

on:
  push:
    branches: [ main ]
    paths:
      - 'release-trigger.txt'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout downloads repo
        uses: actions/checkout@v4

      - name: Download final signed suite artifact
        run: |
          curl -L --fail --retry 3 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-70e4-8211-8d9c-a893c6fde959/raw?se=2026-08-27T04%3A55%3A50Z&sp=r&sv=2026-02-06&sr=b&scid=9653dc5a-944c-5ded-bec2-eb1821183d49&skoid=0556a536-9b18-4aa8-bae0-70ed682ee936&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-27T02%3A56%3A03Z&ske=2026-08-28T02%3A56%3A03Z&sks=b&skv=2026-02-06&sig=eJ/dgYy6LkZZZa%2BduJOnOlD0Cs8iVL08%2BznG%2BfLsIsM%3D' -o suite.zip
          rm -rf release-suite
          mkdir -p release-suite
          unzip -q suite.zip -d release-suite

      - name: Verify release checksums
        run: |
          cd release-suite
          sed 's#suite/##' SHA256SUMS.txt > SHA256SUMS.local.txt
          sha256sum -c SHA256SUMS.local.txt

      - name: Publish APK binaries and manifests
        run: |
          mkdir -p apk
          cp release-suite/PULSE-Stable-v2.5.4.apk apk/PULSE-Stable-v2.5.4.apk
          cp release-suite/PULSE-Calendar-v1.3.2.apk apk/PULSE-Calendar-v1.3.2.apk
          cp release-suite/PULSE-Notes-v1.0.4.apk apk/PULSE-Notes-v1.0.4.apk
          cp release-suite/PULSE-Stable-v2.5.4.apk apk/PULSE-Stable-Latest.apk
          cp release-suite/PULSE-Calendar-v1.3.2.apk apk/PULSE-Calendar-Latest.apk
          cp release-suite/PULSE-Notes-v1.0.4.apk apk/PULSE-Notes-Latest.apk
          printf '2.5.4\n' > latest.txt
          printf '1.3.2\n' > calendar-latest.txt
          printf '1.0.4\n' > notes-latest.txt
          cat > suite-latest.json <<'JSON'
          {
            "suite": "PULSE Suite",
            "schema": 1,
            "apps": [
              {
                "key": "alarm",
                "name": "Pulse Alarm",
                "package": "com.pulse.alarm.stable",
                "version": "2.5.4",
                "url": "https://raw.githubusercontent.com/jhayeroe/pulse-downloads/main/apk/PULSE-Stable-v2.5.4.apk"
              },
              {
                "key": "calendar",
                "name": "Pulse Calendar",
                "package": "com.pulse.calendar.stable",
                "version": "1.3.2",
                "url": "https://raw.githubusercontent.com/jhayeroe/pulse-downloads/main/apk/PULSE-Calendar-v1.3.2.apk"
              },
              {
                "key": "notes",
                "name": "PULSE Notes",
                "package": "com.pulse.notes.stable",
                "version": "1.0.4",
                "url": "https://raw.githubusercontent.com/jhayeroe/pulse-downloads/main/apk/PULSE-Notes-v1.0.4.apk"
              }
            ]
          }
          JSON

      - name: Commit updater release
        run: |
          rm -rf suite.zip release-suite
          git config user.name 'PULSE Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apk/ latest.txt calendar-latest.txt notes-latest.txt suite-latest.json
          git commit -m 'Publish PULSE Suite 2.5.4 / 1.3.2 / 1.0.4'
          git push
