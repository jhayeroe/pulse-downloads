name: Publish PULSE v2.4.2 APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-v242.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public downloads repo
        uses: actions/checkout@v4

      - name: Download signed PULSE v2.4.2 build
        run: |
          curl -L --fail 'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-4dfc-81fa-bc58-08422a85f9d6/raw?se=2026-08-25T02%3A38%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=82df280f-b0f8-5795-82c7-34637aa144c6&skoid=f8b66c09-1aa0-4801-9884-173c5cef2b8c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-25T01%3A10%3A00Z&ske=2026-08-26T01%3A10%3A00Z&sks=b&skv=2026-02-06&sig=9uOddBPMHTyS15KXb4KSIV2u2YNzvLaaFyGNxadTRHU%3D' -o pulse.zip
          rm -rf extracted
          mkdir -p extracted apk
          unzip -o pulse.zip -d extracted
          APK_PATH="$(find extracted -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" apk/PULSE-Stable-v2.4.2.apk
          ls -lh apk/PULSE-Stable-v2.4.2.apk

      - name: Commit APK to public archive
        run: |
          git config user.name 'PULSE Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apk/PULSE-Stable-v2.4.2.apk
          if git diff --cached --quiet; then
            echo 'APK already published.'
            exit 0
          fi
          git commit -m 'Publish PULSE Stable v2.4.2 APK'
          git push
